services:
  postgres:
    
    image: postgres:16
    container_name: website_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: tristancoldefy/tristancoldefy.com-backend:0.5.0
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: website_backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 #--reload
    volumes:
      - ./server:/app
    
  web:
    image: tristancoldefy/tristancoldefy.com-web:0.5.0
    build:
      context: ./web
    container_name: website_frontend
    environment:
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  n8n:
    image: n8nio/n8n
    container_name: website_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Europe/Paris
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_PUBLIC_API_DISABLED=false
    volumes:
      - n8n_data:/home/node/.n8n


volumes:
  pgdata:
  n8n_data:

